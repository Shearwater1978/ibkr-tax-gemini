name: Python application

on:
  # Trigger only on Pull Requests (avoids duplicate runs on merge to main)
  pull_request:
    branches: [ "main", "master" ]
  # Allow manual trigger via GitHub UI
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history is required to diff against the PR base branch.
        fetch-depth: 0

    # Documentation-only PRs cannot change Python behavior, so the interpreter,
    # dependency install, lint, format, and test steps are skipped for them.
    #
    # This job always runs and always reports a status, so a branch-protection
    # required check resolves to success instead of being left pending. Do not
    # convert this into a job-level `if:` or the required check will hang.
    - name: Detect non-Markdown changes
      id: changes
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        BASE="origin/${{ github.base_ref }}"
        git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
        CHANGED="$(git diff --name-only "$BASE...HEAD")"
        echo "Changed files:"
        echo "$CHANGED"
        # Any changed file that is not Markdown means the Python checks must run.
        if printf '%s\n' "$CHANGED" | grep -qv '\.md$'; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "Documentation-only change detected; skipping Python checks."
        fi

    - name: Set up Python 3.12
      if: steps.changes.outputs.run == 'true'
      uses: actions/setup-python@v5  # Updated to v5 (recommended)
      with:
        python-version: "3.12"
        cache: 'pip' # Bonus: Enable dependency caching for speed
        
    - name: Install dependencies
      if: steps.changes.outputs.run == 'true'
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Install linters/formatters if not present in requirements.txt
        pip install flake8 black==26.5.1 pytest

    - name: Lint with flake8
      if: steps.changes.outputs.run == 'true'
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check formatting with black
      if: steps.changes.outputs.run == 'true'
      run: |
        # IMPORTANT: Added --check flag.
        # Without it, this step would just format files in the runner and exit silently.
        # With --check, it fails the build if code is not formatted correctly.
        black --check .

    - name: Test with pytest
      if: steps.changes.outputs.run == 'true'
      run: |
        pytest -v
