# Generate the Xcode project with XcodeGen: `xcodegen generate` (see mobile/README.md).
name: IBKRTaxAssistant
options:
  bundleIdPrefix: com.ibkrtax
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  IBKRTaxAssistant:
    type: application
    platform: iOS
    sources:
      - IBKRTaxAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibkrtax.mobile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: IBKR Tax Assistant
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  IBKRTaxAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - IBKRTaxAssistantTests
    dependencies:
      - target: IBKRTaxAssistant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  IBKRTaxAssistant:
    build:
      targets:
        IBKRTaxAssistant: all
        IBKRTaxAssistantTests: [test]
    test:
      targets:
        - IBKRTaxAssistantTests
