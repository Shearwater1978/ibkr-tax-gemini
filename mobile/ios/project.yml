# Generate the Xcode project with XcodeGen: `xcodegen generate` (see mobile/README.md).
name: IBKRTaxAssistant
options:
  bundleIdPrefix: com.ibkrtax
  deploymentTarget:
    iOS: "16.0"
packages:
  # SQLCipher's official Swift package: a prebuilt xcframework pinned by version and checksum.
  SQLCipher:
    url: https://github.com/sqlcipher/SQLCipher.swift
    exactVersion: 4.19.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  IBKRTaxAssistant:
    type: application
    platform: iOS
    sources:
      - IBKRTaxAssistant
      # Synthetic sample reports for the debug-only "Load synthetic sample reports" action.
      - path: ../fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: SQLCipher
    settings:
      configs:
        # Release builds never package the samples.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: fixtures
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibkrtax.mobile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Portfolio Companion
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID unlocks the app so only you can see your portfolio.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  IBKRTaxAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - IBKRTaxAssistantTests
      # Shared synthetic fixtures, copied as a "fixtures" folder into the test bundle.
      - path: ../fixtures
        type: folder
        buildPhase: resources
    # Xcode 27's XCTest requires iOS 17; the app itself still targets iOS 16.
    deploymentTarget: "17.0"
    dependencies:
      - target: IBKRTaxAssistant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  IBKRTaxAssistant:
    build:
      targets:
        IBKRTaxAssistant: all
        IBKRTaxAssistantTests: [test]
    test:
      targets:
        - IBKRTaxAssistantTests
